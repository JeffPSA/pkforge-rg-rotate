name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo + submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-sign-check

      - name: Restore
        run: dotnet restore src/PKForge.App/PKForge.App.csproj

      - name: Build debug APK
        run: |
          dotnet build src/PKForge.App/PKForge.App.csproj \
            -f net10.0-android \
            -c Debug \
            /p:AndroidPackageFormat=apk \
            --no-restore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkforge-mobile-debug
          path: src/PKForge.App/bin/Debug/net10.0-android/*.apk
          if-no-files-found: error
